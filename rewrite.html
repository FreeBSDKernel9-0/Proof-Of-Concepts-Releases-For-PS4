<!DOCTYPE html>
<html>
<body>
<h1>Probe Status: Running...</h1>
<div id="log"></div>

<script>
    let storage = [];
    let count = 0;

    function allocate() {
        try {
            
            let block = new Uint8Array(5 * 1024 * 1024);
            block.fill(Math.floor(Math.random() * 255));
            storage.push(block);
            count += 5;
            document.getElementById('log').innerHTML = "Allocated: " + count + "MB";
        } catch (e) {
            document.getElementById('log').innerHTML = "Limit: " + count + "MB - " + e.message;
            return; 
        }
        
        setTimeout(allocate, 50); 
    }

    
    setTimeout(allocate, 2000);
</script>
</body>
</html>
