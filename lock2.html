<!DOCTYPE html>
<html>
<head>
    <title>13.04 Lockpick Memory Probing</title>
</head>
<body>
    <div id="status-container">
        <h1>Starting 13.04 Lockpick Memory Probing - Target: 1095MB</h1>
    </div>

    <script>
        function startStressTest() {
            console.log("Starting Lockpick Memory Probing: Target 1095MB");
            var memoryHog = [];
            var totalAllocated = 0;
            var targetMB = 1095;

            try {
                for (var i = 0; i < targetMB; i++) {
                    memoryHog.push(new Uint8Array(1024 * 1024));
                    totalAllocated++;
                    if (totalAllocated % 100 === 0) {
                        console.log("Allocated: " + totalAllocated + "MB");
                    }
                }
                document.body.innerHTML += "<h2>Allocation Complete: " + totalAllocated + "MB</h2>";
            } catch (e) {
                document.body.innerHTML += "<h2 style='color:red;'>System Limit Reached at " + totalAllocated + "MB</h2>";
                console.log("Error: Memory Fail - Allocated higher than 1095 MB. " + e.message);
            }
        }

        async function init() {
            
            document.body.innerHTML = "<h1>Probe Status: Running...</h1>";

            try {
                
                await fetch("/ps4/data/Lockpick");
                
        
                document.body.innerHTML = "<h1>Probe Finished: No Errors (Unexpected File access - (/ps4/data/lockpick)</h1>";
            } catch (e) {
                
                document.body.innerHTML = "<h1>Security Result: " + e.message + "</h1>";
            }

            
            setTimeout(() => {
                startStressTest();
            }, 5000);
        }

        
        
        init();
    </script>
</body>
</html>
