<!DOCTYPE html>
<html>
<head>
    <title>PS4 Test</title>
</head>
<body style="background-color: black; color: #00ff41; text-align: center; padding-top: 100px;">

    <div id="display">READY...</div>

    <script>
        let stressArray = [];
        let count = 0;

        function ps4StressTest() {
            for (let i = 0; i < 1000; i++) {
                let data = "Hello, Lua! #" + count;
                stressArray.push(data); 
                count++;
            }

            // Update the screen
            document.getElementById('display').innerHTML = 
                "<h1 style='font-size: 80px;'>" + count.toLocaleString() + "</h1>";

            setTimeout(ps4StressTest, 10); 
        }

        // Start the test
        ps4StressTest();
    </script>
</body>
</html>
