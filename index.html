        #start .btn:hover { background: #500; }

        /* ==================== GAME OVER MELT OVERLAY ==================== */
        /* Sits above the game canvas. Hidden by default. Triggered by G.   */
        /* The actual melt is drawn into #meltCanvas by JS using DOOM's     */
        /* real f_wipe.c algorithm: a snapshot of the live game canvas is   */
        /* sliced into 160 vertical strips and each strip falls at its own  */
        /* staggered speed, revealing black beneath — same as the engine's  */
        /* native screen-wipe between scenes. The GAME OVER banner fades in */
        /* once the strips are on their way down.                           */
        #melt { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: none; overflow: hidden; background: #000; }
        #melt.on { display: block; }
        #meltCanvas { position: absolute; left: 0; top: 0; image-rendering: -webkit-optimize-contrast; image-rendering: pixelated; }
        #melt .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 80px/1 'Courier New', monospace; color: #e55; letter-spacing: 8px; text-shadow: 0 0 12px #900, 0 0 32px #400; opacity: 0; transform: scale(0.85) rotate(-1deg); }
        #melt.on .banner { animation: banner 4.5s ease-out 1.6s forwards; }
        @keyframes banner {
            0%    { opacity: 0;   transform: scale(0.85) rotate(-1deg); filter: blur(10px) hue-rotate(0deg); }
            30%   { opacity: 1;   transform: scale(1.04) rotate(0.8deg);filter: blur(0px)  hue-rotate(-6deg); }
            60%   { opacity: 1;   transform: scale(1.00) rotate(0deg);  filter: blur(0px)  hue-rotate(0deg); }
            100%  { opacity: 0.95;transform: scale(1.00) rotate(0deg);  filter: blur(0px)  hue-rotate(0deg); }
        }
        #melt .sub { position: absolute; inset: auto 0 18% 0; text-align: center; font: 12px monospace; color: #a22; letter-spacing: 4px; opacity: 0; }
        #melt.on .sub { animation: sub 3s ease-in 2.6s forwards; }
        @keyframes sub { 0%{opacity:0} 100%{opacity:.9} }
        /* ============================================================ */
