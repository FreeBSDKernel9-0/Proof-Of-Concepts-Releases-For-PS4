            }
        }

        function render() {
            pollGamepad();

                let rDirY = dirY + planeY * cameraX;

                else { sY = 1; sideDistY = (mY + 1.0 - pY) * dDistY; }

                    if (map[mX][mY] > 0) hit = 1;
                }

                let pWDist = (side == 0) ? (sideDistX - dDistX) : (sideDistY - dDistY);
                let lineH = Math.floor(screenH / pWDist);

                let drawEnd = lineH / 2 + screenH / 2 + vOffset;

                ctx.beginPath(); ctx.moveTo(x, drawStart); ctx.lineTo(x, drawEnd); ctx.stroke();
            }
            requestAnimationFrame(render);
        }
